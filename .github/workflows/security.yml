name: Terraform Security

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:latest
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Generate Terraform Plan JSON
        working-directory: terraform
        run: terraform show -json tfplan > tfplan.json

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version
          
      - name: OPA Security Policy
        run: |
          opa eval \
            --format pretty \
            --fail-defined \
            --data security/policies \
            --input terraform/tfplan.json \
            'data.terraform.security.deny[_]'    
          
      - name: OPA Security Policy
        shell: bash
        run: |
          set -euo pipefail

          result_file="$(mktemp)"

          opa eval \
          --format=json \
          --data security/policies \
          --input terraform/tfplan.json \
          'data.terraform.security.deny[_]' > "$result_file"

          echo "## Terraform security policy" >> "$GITHUB_STEP_SUMMARY"

          violations=$(jq -r '
          [.result[]?.expressions[]?.value]
          | map(select(. != null))
          | .[]
          ' "$result_file")

          if [ -z "$violations" ]; then
            echo "✅ No security violations found." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "❌ Security violations found:" | tee -a "$GITHUB_STEP_SUMMARY"

          while IFS= read -r violation; do
            echo "- $violation" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error title=Terraform security violation::$violation"
          done <<< "$violations"

          exit 1 
          
      - name: Checkov security scan
        id: checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        continue-on-error: true
        with:
          directory: terraform
          framework: terraform
          output_format: sarif
          output_file_path: console,checkov-results.sarif
          download_external_modules: true
          additional_args: --hard-fail-on HIGH,CRITICAL

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Fail on Checkov HIGH or CRITICAL
        if: always() && steps.checkov.outcome == 'failure'
        run: exit 1